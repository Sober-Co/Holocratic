[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[project]
name = "holocratic"
version = "0.1.0"
description = "Holocratic multi-tenant API service"
readme = "README.md"
authors = [{ name = "Holocratic" }]
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sqlmodel>=0.0.16",
    "sqlalchemy>=2.0.0",
    "pydantic-settings>=2.2.1",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.1.0",
    "redis>=5.0.0",
    "python-dotenv>=1.0.0",
]

[tool.hatch.build]
package-dir = "src"

[tool.hatch.build.targets.wheel]
packages = ["holocratic"]

[tool.hatch.build.targets.sdist]
include = ["src/holocratic", "scripts", "README.md", "LICENSE"]
